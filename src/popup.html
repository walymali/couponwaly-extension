<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="top">
  <img src="icons/icon-32.png" alt="">
  <strong data-i18n="appName"></strong>
  <select id="lang" aria-label="Language"><option value="ar">ع</option><option value="en">EN</option></select>
  <select id="cc" aria-label="Country">
    <option value="sa">🇸🇦</option><option value="ae">🇦🇪</option><option value="kw">🇰🇼</option><option value="eg">🇪🇬</option>
  </select>
</header>
<main>
  <section id="here" hidden>
    <h2 id="hereTitle"></h2>
    <div id="hereList" class="list"></div>
  </section>
  <section id="browse">
    <input id="q" type="search" autocomplete="off" data-i18n-placeholder="searchStore">
    <div id="stores" class="stores"></div>
  </section>
</main>
<footer class="foot">
  <span data-i18n="footNote"></span>
  <a id="site" target="_blank" rel="noopener" href="https://couponwaly.com/?utm_source=extension&amp;utm_medium=popup" data-i18n="openSite"></a>
</footer>
<script src="popup.js"></script>
</body>
</html>
