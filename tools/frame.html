<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>frame</title>
<style>
  html, body { width: 1280px; height: 800px; margin: 0; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: #fff; }
  .band {
    height: 132px; box-sizing: border-box; padding: 0 48px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: #2563eb; color: #fff; border-bottom: 1px solid rgba(15, 23, 42, .12);
  }
  #cap { font-size: 40px; font-weight: 700; line-height: 1.25; }
  .shot { height: 668px; background: FIT_BG; }
  #shot { width: 100%; height: 100%; object-fit: FIT_MODE; object-position: top center; display: block; }
</style>
</head>
<body>
  <div class="band"><div id="cap">CAPTION_TEXT</div></div>
  <div class="shot"><img id="shot" src="SHOT_SRC" alt=""></div>
</body>
</html>
